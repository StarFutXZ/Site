<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operação Manda DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #1a0a2e;
    --bg2: #0b0616;
    --pink: #ff3d8b;
    --pink2: #ff8fb8;
    --gold: #f2c26b;
    --ink: #fff3f8;
    --soft: #b79ac9;
    --card: #22103a;
    --line: #5a3d52;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    background:
      conic-gradient(from 200deg at 50% -10%, transparent 0 8%, rgba(255,61,139,.18) 12%, transparent 16% 84%, rgba(255,61,139,.18) 88%, transparent 92%),
      linear-gradient(180deg, #4a1a4f 0%, var(--bg1) 38%, var(--bg2) 100%);
    background-attachment: fixed;
    padding: env(safe-area-inset-top, 0) 18px env(safe-area-inset-bottom, 0);
    overflow-x: hidden;
  }
  main { max-width: 480px; margin: 0 auto; padding: 18px 0 40px; text-align: center; }

  .hero svg { width: 100%; max-width: 360px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
  h1 { font-family: "Lilita One", Impact, sans-serif; font-weight: 400; line-height: .92; margin-top: -42px; position: relative; }
  h1 span {
    display: block;
    background: linear-gradient(180deg, #ff6aa6, #e0136f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px var(--gold); paint-order: stroke fill;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.35));
  }
  h1 .a { font-size: clamp(2.4rem, 12vw, 3.4rem); }
  h1 .b { font-size: clamp(3.4rem, 18vw, 5rem); }

  .banner {
    margin: 26px 0 22px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 99px;
    background: rgba(20,10,40,.7);
    font-weight: 800; font-size: .88rem; letter-spacing: .06em;
  }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile {
    background: linear-gradient(180deg, #2d1550, var(--card));
    border: 1.5px solid var(--line); border-radius: 22px;
    padding: 14px 6px 12px;
  }
  .num {
    font-weight: 800; font-size: clamp(2.2rem, 12vw, 3.2rem); line-height: 1;
    background: linear-gradient(180deg, #fff, var(--pink2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .lab { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--gold); font-weight: 800; font-size: .72rem; letter-spacing: .16em; }

  .prog { margin-top: 28px; text-align: left; font-size: .8rem; color: var(--soft); }
  .prog .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .prog .row b { color: var(--gold); }
  .bar { height: 12px; border-radius: 99px; background: #2b1745; border: 1px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: width .8s linear; }

  button {
    margin-top: 30px; width: 100%; cursor: pointer;
    font: 800 1rem "JetBrains Mono", monospace; letter-spacing: .04em;
    color: #2a0a1c; background: linear-gradient(180deg, #ffd98a, var(--gold));
    border: 0; border-radius: 99px; padding: 17px 20px;
    box-shadow: 0 6px 0 #a67b2e;
  }
  button:active { transform: translateY(3px); box-shadow: 0 3px 0 #a67b2e; }
  button:focus-visible { outline: 3px solid var(--pink2); outline-offset: 3px; }

  body.urgent .banner { border-color: var(--pink); color: var(--gold); }
  body.urgent .tile { border-color: var(--pink); animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 22px rgba(255,61,139,.55); } }
  body.done .tile { border-color: var(--gold); animation: none; }

  .heart { position: fixed; bottom: -30px; font-size: 26px; pointer-events: none; animation: up 2.4s ease-out forwards; }
  @keyframes up { to { transform: translateY(-110vh) rotate(20deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { body.urgent .tile, .heart { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="hero">
    <svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agente secreto com telemóvel">
      <defs>
        <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb8"/><stop offset="1" stop-color="#e0136f"/></linearGradient>
      </defs>
      <!-- fato -->
      <path d="M95 250V175l65-24 65 24v75z" fill="#150a28" stroke="#f2c26b" stroke-width="1.5"/>
      <path d="M140 160h40l-20 58z" fill="#fff6ee"/>
      <path d="M160 176l-18-9v18zM160 176l18-9v18z" fill="#ff3d8b"/>
      <rect x="153" y="171" width="14" height="10" rx="3" fill="#f2c26b"/>
      <!-- cabeça -->
      <ellipse cx="160" cy="118" rx="36" ry="34" fill="#2a1740" stroke="#150a28" stroke-width="2"/>
      <ellipse cx="146" cy="108" rx="9" ry="6" fill="#ffd23f"/><ellipse cx="174" cy="108" rx="9" ry="6" fill="#ffd23f"/>
      <circle cx="146" cy="108" r="2.5" fill="#150a28"/><circle cx="174" cy="108" r="2.5" fill="#150a28"/>
      <path d="M135 128q25 22 50 0v14q-25 14-50 0z" fill="#150a28"/>
      <!-- chapéu -->
      <path d="M126 88v-34q0-10 12-10h44q12 0 12 10v34z" fill="#2a1740" stroke="#150a28" stroke-width="2"/>
      <rect x="126" y="72" width="68" height="9" fill="#f2c26b"/>
      <ellipse cx="160" cy="90" rx="68" ry="13" fill="#2a1740" stroke="#f2c26b" stroke-width="2"/>
      <!-- telemóvel -->
      <g transform="rotate(-12 70 130)">
        <rect x="36" y="64" width="68" height="124" rx="14" fill="#150a28" stroke="#f2c26b" stroke-width="3"/>
        <rect x="44" y="76" width="52" height="100" rx="8" fill="url(#scr)"/>
        <rect x="50" y="86" width="26" height="9" rx="4.5" fill="#fff" opacity=".9"/>
        <rect x="58" y="102" width="32" height="9" rx="4.5" fill="#fff" opacity=".7"/>
        <path d="M70 160c-16-10-18-22-10-27 5-3 8 0 10 3 2-3 5-6 10-3 8 5 6 17-10 27z" fill="#fff"/>
      </g>
      <!-- chifres -->
      <path d="M30 70q4 40 36 52" fill="none" stroke="#f2c26b" stroke-width="5" stroke-linecap="round"/>
      <path d="M118 126q34-4 52-30" fill="none" stroke="#f2c26b" stroke-width="4" stroke-linecap="round" opacity="0"/>
    </svg>
    <h1><span class="a">OPERAÇÃO</span><span class="b">MANDA DM</span></h1>
  </div>

  <p class="banner" id="banner">⏳ O TEMPO ESTÁ A ACABAR, SOLDADO!</p>

  <section class="tiles" aria-label="Tempo restante">
    <div class="tile"><div class="num" id="h">00</div><div class="lab">HORAS</div></div>
    <div class="tile"><div class="num" id="m">00</div><div class="lab">MINUTOS</div></div>
    <div class="tile"><div class="num" id="s">00</div><div class="lab">SEGUNDOS</div></div>
  </section>

  <section class="prog">
    <div class="row"><span>PROGRESSO DO DIA</span><b id="pct">0.0% CONCLUÍDO</b></div>
    <div class="bar"><i id="fill"></i></div>
  </section>

  <button id="btn" type="button">💌 Já mandei a mensagem</button>
</main>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  let feito = false;

  function mensagem(s) {
    if (s <= 0) return '💔 TEMPO ESGOTADO, SOLDADO!';
    if (s <= 600) return '🚨 ÚLTIMOS MINUTOS! MANDA JÁ!';
    if (s <= 3600) return '🔥 MENOS DE UMA HORA, SOLDADO!';
    if (s <= 4 * 3600) return '⏳ O TEMPO ESTÁ A ACABAR, SOLDADO!';
    return '🎯 A MISSÃO ACABA HOJE À MEIA-NOITE';
  }

  function tick() {
    if (feito) return;
    const agora = new Date();
    const fim = new Date(agora); fim.setHours(24, 0, 0, 0);
    const ini = new Date(agora); ini.setHours(0, 0, 0, 0);
    const s = Math.max(0, Math.floor((fim - agora) / 1000));

    $('h').textContent = pad(Math.floor(s / 3600));
    $('m').textContent = pad(Math.floor((s % 3600) / 60));
    $('s').textContent = pad(s % 60);

    const p = ((agora - ini) / (fim - ini)) * 100;
    $('fill').style.width = p.toFixed(2) + '%';
    $('pct').textContent = p.toFixed(1) + '% CONCLUÍDO';
    $('banner').textContent = mensagem(s);
    document.body.classList.toggle('urgent', s <= 3600 && s > 0);
  }

  function coracoes() {
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'heart';
      el.textContent = ['💖', '💘', '💌', '💗'][i % 4];
      el.style.left = Math.random() * 95 + 'vw';
      el.style.animationDelay = Math.random() * 0.8 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
  }

  $('btn').addEventListener('click', () => {
    feito = true;
    document.body.classList.remove('urgent');
    document.body.classList.add('done');
    $('banner').textContent = '🏆 MISSÃO CUMPRIDA, SOLDADO!';
    $('h').textContent = $('m').textContent = $('s').textContent = '✓';
    $('fill').style.width = '100%';
    $('btn').hidden = true;
    coracoes();
  });

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
