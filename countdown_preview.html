<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launching Soon — Countdown Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f8f6e8}
body{min-height:100vh;display:flex;justify-content:center;background:#04182b;overflow-x:hidden}
.page{width:min(100%,520px);min-height:100vh;position:relative;overflow:hidden;padding:32px 18px 42px;background:radial-gradient(ellipse at 50% 20%,#1d5574 0,#103b5d 38%,#06233e 70%,#031426 100%);isolation:isolate}
.page:before,.page:after{content:"";position:absolute;z-index:-1;left:-20%;width:140%;height:220px;border-radius:50%;border:2px solid #65d8d0;opacity:.5;filter:drop-shadow(0 0 8px #2db7c7)}
.page:before{top:48%;transform:rotate(-4deg);box-shadow:0 12px 0 #0b3152,0 24px 0 #0b3152,0 34px 0 #1b7a9a}
.page:after{bottom:-85px;transform:rotate(5deg);box-shadow:0 -12px 0 #0a3556,0 -24px 0 #0a3556,0 -38px 0 #155e85}
.stars{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#d5f8ee 1px,transparent 1.5px),radial-gradient(#75d9e8 1px,transparent 1.5px);background-size:55px 70px,83px 91px;background-position:4px 9px,20px 34px;opacity:.35}
.art{height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.art .eyebrow{letter-spacing:.28em;font-size:12px;color:#b5eee5;font-weight:800;text-shadow:0 2px 6px #000}
.logo{font-size:clamp(48px,14vw,76px);font-weight:1000;line-height:.95;letter-spacing:-.05em;color:#e7f5f0;text-shadow:3px 4px 0 #0c3957,5px 7px 0 #b88a27,0 0 22px #55b6cf;margin:18px 0}
.logo span{display:block;color:#f6d05a;text-shadow:3px 4px 0 #16496b,5px 7px 0 #8e6320,0 0 20px #4cc1dc}
.launch{font-size:13px;font-weight:900;letter-spacing:.22em;color:#75e8dc;text-shadow:0 0 12px #42c5d2;margin-top:12px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 30px}
.unit{position:relative;background:linear-gradient(180deg,#0b2b48,#061d34);border:2px solid #c9952b;border-radius:13px;padding:15px 6px 12px;text-align:center;box-shadow:inset 0 0 0 2px #315b77,0 0 12px #06111f;min-width:0}
.unit:before,.unit:after{content:"✦";position:absolute;color:#e9c14c;font-size:13px;text-shadow:0 0 7px #f4d45c}.unit:before{top:-9px;left:-5px}.unit:after{bottom:-9px;right:-5px}
.num{font-size:clamp(25px,8vw,42px);font-weight:950;letter-spacing:.02em;text-shadow:0 2px 8px #4aa2bb;line-height:1.1}
.label{margin-top:7px;font-size:10px;letter-spacing:.16em;font-weight:900;color:#e7c85a}
.date-panel{margin:20px 2px 0;padding:22px 14px;border:3px solid #e1b53f;border-radius:24px;background:linear-gradient(135deg,#062543,#0a3b61 60%,#05223d);box-shadow:inset 0 0 0 3px #315c7c,0 0 18px #02111f;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;min-height:92px}
.lock{font-size:35px;filter:drop-shadow(0 2px 3px #000)}.date-text{font-size:clamp(12px,3.8vw,16px);font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.note{text-align:center;color:#b8d7e5;font-size:11px;letter-spacing:.15em;margin-top:25px}
@media(min-width:480px){.page{padding-left:28px;padding-right:28px}.countdown{gap:14px}.art{height:360px}}
</style>
</head>
<body>
<main class="page"><div class="stars"></div>
<section class="art"><div class="eyebrow">A NEW ADVENTURE BEGINS</div><div class="logo">VOX<span>SEAS</span></div><div class="launch">LAUNCHING SOON</div></section>
<section class="countdown" aria-label="Countdown">
<div class="unit"><div class="num" id="days">00</div><div class="label">DAYS</div></div>
<div class="unit"><div class="num" id="hours">00</div><div class="label">HOURS</div></div>
<div class="unit"><div class="num" id="mins">00</div><div class="label">MIN</div></div>
<div class="unit"><div class="num" id="secs">00</div><div class="label">SEC</div></div>
</section>
<section class="date-panel"><div class="lock">🔒</div><div class="date-text" id="releaseText">AVAILABLE JAN 1, 2027 · 12:00 AM</div></section>
<div class="note">THE OCEAN IS CALLING...</div>
</main>
<script>
// Preview target: 1 January 2027 at midnight (Portugal mainland time).
const target = new Date('2027-01-01T00:00:00+00:00').getTime();
const pad = n => String(n).padStart(2,'0');
function tick(){let diff=Math.max(0,target-Date.now());let days=Math.floor(diff/86400000);diff%=86400000;let hours=Math.floor(diff/3600000);diff%=3600000;let mins=Math.floor(diff/60000);diff%=60000;let secs=Math.floor(diff/1000);
document.getElementById('days').textContent=pad(days);document.getElementById('hours').textContent=pad(hours);document.getElementById('mins').textContent=pad(mins);document.getElementById('secs').textContent=pad(secs);}
tick();setInterval(tick,1000);
</script>
</body>
</html>
