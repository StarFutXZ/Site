<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPERAÇÃO: MANDA DM • Prazo Meia-Noite (00:00)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Lilita One & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Lilita+One&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-void: #070412;
      --bg-velvet: #120826;
      --gold-champagne: #f5d08a;
      --gold-warm: #e5a95c;
      --neon-crimson: #ff2e7e;
      --neon-rose: #ff75ab;
      --font-display: 'Outfit', sans-serif;
      --font-emblem: 'Lilita One', cursive, sans-serif;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-ui);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--bg-void);
      color: #ffffff;
      user-select: none;
    }

    .font-display { font-family: var(--font-display); }
    .font-emblem { font-family: var(--font-emblem); }
    .font-mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Textura Cinematográfica Subtil (Film Grain) */
    .cinema-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 45;
      opacity: 0.038;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Fundo Atmosférico Hero (Velvet Midnight & Luzes Volumétricas) */
    .hero-atmosphere {
      background:
        radial-gradient(ellipse 75% 50% at 50% 18%, rgba(255, 46, 126, 0.34) 0%, rgba(124, 33, 168, 0.18) 42%, transparent 75%),
        radial-gradient(circle at 18% 22%, rgba(245, 208, 138, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 82% 28%, rgba(255, 46, 126, 0.2) 0%, transparent 48%),
        linear-gradient(180deg, #0d0620 0%, #160930 48%, #0b051c 100%);
    }

    /* Secção Inferior Profunda */
    .vault-atmosphere {
      background:
        radial-gradient(ellipse 80% 55% at 50% 0%, rgba(255, 46, 126, 0.16) 0%, transparent 70%),
        linear-gradient(180deg, #0d0620 0%, #090417 55%, #05020d 100%);
    }

    /* Glassmorphism de Estúdio AAA */
    .studio-glass {
      background: linear-gradient(155deg, rgba(28, 14, 52, 0.78) 0%, rgba(12, 6, 26, 0.92) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(245, 208, 138, 0.32);
      box-shadow:
        0 20px 45px -12px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.16),
        0 0 28px -8px rgba(255, 46, 126, 0.28);
    }

    .studio-glass-card {
      position: relative;
      background: linear-gradient(165deg, rgba(33, 16, 61, 0.82) 0%, rgba(13, 6, 28, 0.94) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(245, 208, 138, 0.35);
      box-shadow:
        0 18px 36px -10px rgba(0, 0, 0, 0.85),
        inset 0 1px 1px rgba(255, 240, 215, 0.22),
        inset 0 -12px 24px rgba(255, 46, 126, 0.08);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .studio-glass-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(245, 208, 138, 0.75);
      box-shadow:
        0 24px 48px -10px rgba(0, 0, 0, 0.9),
        0 0 32px rgba(255, 46, 126, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    /* Dígitos Metálicos Luminosos */
    .digit-glow {
      background: linear-gradient(180deg, #ffffff 15%, #ffd6e8 62%, #ff85b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 46, 126, 0.65));
    }

    .digit-urgent {
      background: linear-gradient(180deg, #fff0f3 10%, #ff4d6d 55%, #c9184a 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      filter: drop-shadow(0 0 22px rgba(255, 23, 68, 0.95)) !important;
      animation: urgentPulse 0.8s ease-in-out infinite;
    }

    /* Brilho Especular Animado no Logotipo */
    @keyframes specularSweep {
      0% { transform: translateX(-140%) skewX(-22deg); }
      45%, 100% { transform: translateX(240%) skewX(-22deg); }
    }

    .logo-sheen {
      animation: specularSweep 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes floatHero {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes holoPulse {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(255, 46, 126, 0.7)); }
      50% { filter: drop-shadow(0 0 30px rgba(245, 208, 138, 0.85)); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.24); }
      36% { transform: scale(1.04); }
      54% { transform: scale(1.18); }
    }

    @keyframes urgentPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    .animate-hero-float { animation: floatHero 4.8s ease-in-out infinite; }
    .animate-holo { animation: holoPulse 3.4s ease-in-out infinite; }
    .animate-heartbeat {
      animation: heartBeat 1s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .dot-1 { animation: typingDot 1.4s infinite 0s; }
    .dot-2 { animation: typingDot 1.4s infinite 0.2s; }
    .dot-3 { animation: typingDot 1.4s infinite 0.4s; }

    /* Banner Hexagonal Estático Ouro-Champanhe & Rosa-Néons */
    .deadline-hex-banner {
      background: linear-gradient(135deg, rgba(38, 15, 64, 0.92) 0%, rgba(15, 6, 30, 0.96) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(245, 208, 138, 0.65);
      box-shadow:
        0 18px 42px -10px rgba(0, 0, 0, 0.88),
        0 0 28px -6px rgba(255, 46, 126, 0.38),
        inset 0 1px 1px rgba(255, 245, 224, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-pink-500 selection:text-white">

  <!-- Textura Subtil de Cinema -->
  <div class="cinema-grain"></div>

  <!-- =====================================================================
       SECÇÃO HERO: CENÁRIO CINEMATOGRÁFICO, AGENTE WINGMAN & LOGOTIPO 3D
  ====================================================================== -->
  <header class="relative w-full hero-atmosphere pt-8 sm:pt-12 pb-10 sm:pb-14 overflow-hidden flex flex-col items-center">

    <!-- Fundo Vetorial: Céu Estrelado, Lua Dourada, Feixes Volumétricos & Skyline -->
    <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1440 700" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="champagneMoonHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6e5" stop-opacity="0.95"/>
          <stop offset="30%" stop-color="#f5d08a" stop-opacity="0.32"/>
          <stop offset="70%" stop-color="#ff2e7e" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#0d0620" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="volumetricRay" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#f5d08a" stop-opacity="0.22"/>
          <stop offset="55%" stop-color="#ff2e7e" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#0d0620" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="skylineFar" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1d0d3d" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#0b051c" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="skylineNear" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#120729" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#070412" stop-opacity="1"/>
        </linearGradient>
      </defs>

      <!-- Feixes Volumétricos -->
      <polygon points="620,0 820,0 1160,680 280,680" fill="url(#volumetricRay)"/>
      <polygon points="400,0 490,0 240,620 40,620" fill="url(#volumetricRay)" opacity="0.5"/>
      <polygon points="950,0 1040,0 1400,620 1200,620" fill="url(#volumetricRay)" opacity="0.5"/>

      <!-- Estrelas de Precisão -->
      <g fill="#fff8eb">
        <circle cx="140" cy="85" r="2" opacity="0.8"/><circle cx="240" cy="150" r="1.4" opacity="0.5"/>
        <circle cx="350" cy="65" r="2.4" opacity="0.9"/><circle cx="510" cy="105" r="1.5" opacity="0.6"/>
        <circle cx="930" cy="75" r="2.2" opacity="0.85"/><circle cx="1070" cy="145" r="1.6" opacity="0.6"/>
        <circle cx="1210" cy="82" r="2.5" opacity="0.9"/><circle cx="1320" cy="175" r="1.8" opacity="0.7"/>
        <circle cx="185" cy="260" r="1.6" opacity="0.5"/><circle cx="1265" cy="265" r="2" opacity="0.6"/>
      </g>

      <!-- Estrela Cadente Elegante -->
      <line x1="1150" y1="95" x2="1010" y2="155" stroke="url(#champagneMoonHalo)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1150" cy="95" r="2.5" fill="#fff6e5"/>

      <!-- Lua Crescente Champanhe -->
      <g transform="translate(245, 130)">
        <circle cx="0" cy="0" r="115" fill="url(#champagneMoonHalo)"/>
        <path d="M-10 -36 A38 38 0 1 0 32 20 A30 30 0 1 1 -10 -36 Z" fill="#fff3d6"/>
      </g>

      <!-- Horizonte Urbano (Camada Distante) -->
      <path d="M0,660 L0,470 L70,470 L70,420 L145,420 L145,485 L220,485 L220,390 L300,390 L300,450 L390,450 L390,375 L475,375 L475,460 L965,460 L965,385 L1050,385 L1050,440 L1135,440 L1135,365 L1220,365 L1220,435 L1310,435 L1310,400 L1385,400 L1385,465 L1440,465 L1440,660 Z"
            fill="url(#skylineFar)"/>

      <!-- Horizonte Urbano (Camada Próxima com Luzes) -->
      <path d="M0,680 L0,520 L95,520 L95,465 L175,465 L175,530 L260,530 L260,445 L345,445 L345,515 L1095,515 L1095,450 L1185,450 L1185,505 L1275,505 L1275,440 L1360,440 L1360,515 L1440,515 L1440,680 Z"
            fill="url(#skylineNear)"/>

      <!-- Luzes das Janelas (Ouro Champanhe & Rosa) -->
      <g opacity="0.55">
        <rect x="115" y="485" width="7" height="12" rx="1.5" fill="#f5d08a"/>
        <rect x="132" y="485" width="7" height="12" rx="1.5" fill="#ff75ab"/>
        <rect x="280" y="468" width="8" height="14" rx="1.5" fill="#f5d08a"/>
        <rect x="298" y="468" width="8" height="14" rx="1.5" fill="#f5d08a"/>
        <rect x="280" y="492" width="8" height="14" rx="1.5" fill="#ff75ab"/>
        <rect x="1115" y="472" width="8" height="14" rx="1.5" fill="#f5d08a"/>
        <rect x="1295" y="462" width="8" height="14" rx="1.5" fill="#ff75ab"/>
        <rect x="1315" y="462" width="8" height="14" rx="1.5" fill="#f5d08a"/>
      </g>
    </svg>

    <!-- Personagem Central (Agente Wingman / Cupido Noturno com Rim Lighting) -->
    <div class="relative z-10 w-full max-w-[660px] px-2 flex justify-center">
      <svg class="w-full h-auto max-h-[410px] sm:max-h-[475px] drop-shadow-[0_22px_38px_rgba(0,0,0,0.85)]" viewBox="0 0 760 610" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Ouro Champanhe Metálico -->
          <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff6e0"/>
            <stop offset="35%" stop-color="#f5d08a"/>
            <stop offset="72%" stop-color="#c98a42"/>
            <stop offset="100%" stop-color="#ffe7ba"/>
          </linearGradient>
          <!-- Fato Velvet Escuro com Rim Light -->
          <linearGradient id="velvetSuit" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b144d"/>
            <stop offset="55%" stop-color="#150829"/>
            <stop offset="100%" stop-color="#090314"/>
          </linearGradient>
          <!-- Camisa Seda -->
          <linearGradient id="silkShirt" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dfd0e8"/>
          </linearGradient>
          <!-- Ecrã Holográfico Magenta -->
          <linearGradient id="holoScreen" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ff85b8"/>
            <stop offset="38%" stop-color="#ff2e7e"/>
            <stop offset="82%" stop-color="#7a1149"/>
            <stop offset="100%" stop-color="#1f0524"/>
          </linearGradient>
          <!-- Rim Light Neon -->
          <linearGradient id="rimNeon" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff2e7e"/>
            <stop offset="50%" stop-color="#f5d08a"/>
            <stop offset="100%" stop-color="#ff2e7e"/>
          </linearGradient>
        </defs>

        <!-- Aura Circular Suave Atrás do Agente -->
        <circle cx="475" cy="220" r="195" fill="none" stroke="url(#rimNeon)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35"/>
        <circle cx="475" cy="220" r="155" fill="#ff2e7e" opacity="0.08"/>

        <!-- ================= CORPO DO AGENTE WINGMAN ================= -->
        <g id="wingman-agent">
          <!-- Braço Direito (A segurar o Smartphone Holográfico) -->
          <g transform="rotate(13 235 190)">
            <rect x="135" y="105" width="170" height="220" rx="20" fill="url(#velvetSuit)" stroke="#070210" stroke-width="4.5"/>
            <!-- Rim Light Rosa na Borda Exterior -->
            <path d="M138 125 L138 305" stroke="#ff2e7e" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
          </g>

          <!-- Tronco (Smoking Moderno) -->
          <path d="M295 192 L615 168 L658 430 L275 445 Z" fill="url(#velvetSuit)" stroke="#070210" stroke-width="4.5" stroke-linejoin="round"/>
          <!-- Rim Light Dourado no Ombro -->
          <path d="M298 193 L612 169" stroke="#f5d08a" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

          <!-- Camisa Seda & Lapelas -->
          <polygon points="405,188 468,312 535,180" fill="url(#silkShirt)" stroke="#070210" stroke-width="3.5"/>
          <polygon points="405,188 374,262 445,322 468,312" fill="#210d3d" stroke="#070210" stroke-width="3.5"/>
          <polygon points="535,180 566,258 490,322 468,312" fill="#210d3d" stroke="#070210" stroke-width="3.5"/>

          <!-- Gravata-Borboleta Carmesim & Ouro -->
          <g transform="translate(468, 220) rotate(-4)">
            <polygon points="-32,-15 -6,-4 -6,8 -30,17" fill="#ff2e7e" stroke="#070210" stroke-width="3.5" stroke-linejoin="round"/>
            <polygon points="32,-15 6,-4 6,8 30,17" fill="#b81456" stroke="#070210" stroke-width="3.5" stroke-linejoin="round"/>
            <rect x="-8" y="-8" width="16" height="18" rx="5" fill="#f5d08a" stroke="#070210" stroke-width="3.5"/>
          </g>

          <!-- Rosa de Lapela Estilizada -->
          <g transform="translate(534, 245) rotate(14)">
            <path d="M0 0 L-5 19" stroke="#38b000" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="0" cy="-4" r="10.5" fill="#ff2e7e" stroke="#070210" stroke-width="3"/>
            <circle cx="-2" cy="-6" r="4.5" fill="#ff9ec6"/>
          </g>

          <!-- Base do Fato -->
          <path d="M265 408 Q465 380 665 418 L695 570 L225 570 Z" fill="#0b0417" stroke="#05010a" stroke-width="4.5"/>

          <!-- Braço Esquerdo Frontal -->
          <g transform="rotate(-17 655 255)">
            <rect x="595" y="182" width="142" height="230" rx="18" fill="url(#velvetSuit)" stroke="#070210" stroke-width="4.5"/>
            <path d="M734 195 L734 395" stroke="#f5d08a" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
            <rect x="595" y="348" width="142" height="82" rx="12" fill="url(#silkShirt)" stroke="#070210" stroke-width="4.5"/>
            <circle cx="628" cy="388" r="7.5" fill="url(#champagneGold)" stroke="#070210" stroke-width="2.5"/>
          </g>

          <!-- ================= CABEÇA, ÓCULOS NEON & FEDORA ================= -->
          <g transform="translate(485, 128) rotate(-5)">
            <rect x="-76" y="-64" width="152" height="142" rx="34" fill="#f3d4c2" stroke="#070210" stroke-width="4.5"/>
            <!-- Barba / Cabelo Estilizado -->
            <path d="M-74 18 Q-82 54 -50 70 L-35 60 L-20 80 L0 66 L20 80 L35 60 L50 70 Q82 54 74 18 Q44 33 0 25 Q-44 33 -74 18 Z"
                  fill="#23103b" stroke="#070210" stroke-width="4" stroke-linejoin="round"/>
            <!-- Sorriso Confiante -->
            <path d="M-22 22 Q2 35 26 18" stroke="#070210" stroke-width="4" stroke-linecap="round" fill="none"/>

            <!-- Óculos Aviador / Redondos com Armação Champanhe -->
            <line x1="-80" y1="-15" x2="80" y2="-15" stroke="#f5d08a" stroke-width="6.5"/>
            <circle cx="-35" cy="-12" r="27" fill="#0d041a" stroke="#f5d08a" stroke-width="5"/>
            <circle cx="34" cy="-12" r="27" fill="#0d041a" stroke="#f5d08a" stroke-width="5"/>

            <!-- Reflexo de Coração Neon nas Lentes -->
            <path d="M-35 -3 C-44 -10 -48 -17 -42 -21 C-38 -23 -36 -20 -35 -17 C-34 -20 -32 -23 -28 -21 C-22 -17 -26 -10 -35 -3 Z"
                  fill="#ff2e7e"/>
            <path d="M34 -3 C25 -10 21 -17 27 -21 C31 -23 33 -20 34 -17 C35 -20 37 -23 41 -21 C47 -17 43 -10 34 -3 Z"
                  fill="#ff2e7e"/>

            <!-- Fedora Noturno com Faixa Ouro-Champanhe -->
            <ellipse cx="0" cy="-38" rx="134" ry="40" fill="url(#velvetSuit)" stroke="#070210" stroke-width="4.5"/>
            <ellipse cx="0" cy="-38" rx="132" ry="38" fill="none" stroke="#ff2e7e" stroke-width="1.5" opacity="0.6"/>
            <path d="M-72 -38 L-60 -90 Q0 -110 60 -90 L72 -38 Q0 -22 -72 -38 Z"
                  fill="url(#velvetSuit)" stroke="#070210" stroke-width="4.5" stroke-linejoin="round"/>
            <path d="M-70 -51 Q0 -35 70 -51 L72 -38 Q0 -22 -72 -38 Z"
                  fill="url(#champagneGold)" stroke="#070210" stroke-width="3"/>
          </g>
        </g>

        <!-- ================= EMBLEMA FLUTUANTE DE NOTIFICAÇÃO (1 DM) ================= -->
        <g class="animate-hero-float" transform="translate(656, 120)">
          <circle cx="0" cy="0" r="46" fill="#ff2e7e" opacity="0.22"/>
          <path d="M-36 -24 H36 A14 14 0 0 1 50 -10 V14 A14 14 0 0 1 36 28 H8 L-10 43 L-8 28 H-36 A14 14 0 0 1 -50 14 V-10 A14 14 0 0 1 -36 -24 Z"
                fill="#1b0933" stroke="#f5d08a" stroke-width="3.5" stroke-linejoin="round"/>
          <!-- Coração Neon -->
          <path d="M0 13 C-16 2 -22 -8 -13 -14 C-7 -18 -2 -14 0 -10 C2 -14 7 -18 13 -14 C22 -8 16 2 0 13 Z"
                fill="#ff2e7e"/>
          <!-- Badge "1" -->
          <circle cx="40" cy="-22" r="14" fill="#ff2e7e" stroke="#fff3d6" stroke-width="2.5"/>
          <text x="40" y="-17" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ffffff">1</text>
        </g>

        <!-- ================= ARTEFACTO SMARTPHONE HOLOGRÁFICO ================= -->
        <g id="holo-phone" class="animate-holo" transform="translate(185, 282) rotate(13)">
          <!-- Moldura Obsidiana & Ouro Champanhe -->
          <rect x="-76" y="-114" width="152" height="378" rx="28" fill="#0e051f" stroke="#070210" stroke-width="5"/>
          <rect x="-71" y="-109" width="142" height="368" rx="24" fill="none" stroke="url(#champagneGold)" stroke-width="4"/>

          <!-- Ecrã Luminoso -->
          <rect x="-54" y="-92" width="108" height="332" rx="16" fill="url(#holoScreen)" stroke="#1f0524" stroke-width="3"/>
          <rect x="-24" y="-92" width="48" height="11" rx="5.5" fill="#090314"/>

          <!-- Bolha 1: "A escrever..." Animada -->
          <g>
            <rect x="-42" y="-60" width="68" height="24" rx="12" fill="#ffffff" opacity="0.94"/>
            <circle class="dot-1" cx="-22" cy="-48" r="3.2" fill="#ff2e7e"/>
            <circle class="dot-2" cx="-10" cy="-48" r="3.2" fill="#ff2e7e"/>
            <circle class="dot-3" cx="2" cy="-48" r="3.2" fill="#ff2e7e"/>
          </g>

          <!-- Bolha 2: Mensagem Enviada com Coração -->
          <g>
            <rect x="-20" y="-26" width="64" height="24" rx="12" fill="#fff3d6" opacity="0.96"/>
            <line x1="-10" y1="-14" x2="14" y2="-14" stroke="#b8742a" stroke-width="3" stroke-linecap="round"/>
